version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ascend_ai
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ascend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ascend:localdev@postgres:5432/ascend_ai
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      ALLOW_FALLBACK_QUESTIONS: "true"
      WEB_CONCURRENCY: "1"
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/data/chroma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_API_URL: http://backend:8000
    env_file:
      - frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  redisdata:
  chromadata:
