[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile"

[deploy]
# Set WEB_CONCURRENCY > 1 only if REDIS_URL is configured.
# startCommand overrides Dockerfile CMD — keep this pointing at scripts/start.sh
# so PYQ ingest cannot be skipped again.
startCommand = "sh /app/scripts/start.sh"
healthcheckPath = "/health"
# First boot runs fastembed ingest; 30s was too short and killed healthy deploys.
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
