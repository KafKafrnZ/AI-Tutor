[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile"

[deploy]
# Set WEB_CONCURRENCY > 1 only if REDIS_URL is configured.
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${WEB_CONCURRENCY:-1}'"
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3