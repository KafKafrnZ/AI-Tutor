name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    name: Pytest + Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      JWT_SECRET: ci-test-secret-not-for-production
      ENVIRONMENT: test
      LLM_API_KEY: dummy-key-for-ci
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
        working-directory: ${{ github.workspace }}

      - name: Run Alembic migration smoke test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          echo "Migration smoke test passed"
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: pytest backend/tests/ -v --tb=short
        working-directory: ${{ github.workspace }}

      - name: Type check
        run: mypy backend/app/ --ignore-missing-imports --no-error-summary
        working-directory: ${{ github.workspace }}
