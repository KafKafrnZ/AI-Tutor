name: Deploy Gate

# Fires whenever Backend CI or Frontend CI finishes.
# Posts a single "deploy-gate" commit status so branch protection
# can require it before any merge or deploy proceeds.
on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]

permissions:
  statuses: write
  actions: read

jobs:
  gate:
    name: All CI required
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI and post deploy-gate status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const triggering = context.payload.workflow_run.name;
            const triggeringConclusion = context.payload.workflow_run.conclusion;

            // Map workflow → job name as it appears in GitHub check runs
            const JOB_NAMES = {
              'Backend CI':  'Pytest + Type Check',
              'Frontend CI': 'Lint + Type Check + Build',
            };

            async function postStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                sha,
                state,       // 'success' | 'failure' | 'pending'
                context:     'deploy-gate',
                description,
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              console.log(`deploy-gate → ${state}: ${description}`);
            }

            // 1. The workflow that just finished must have succeeded.
            if (triggeringConclusion !== 'success') {
              await postStatus(
                'failure',
                `${triggering} ${triggeringConclusion} — deploy blocked`
              );
              core.setFailed(`${triggering} did not succeed (${triggeringConclusion}).`);
              return;
            }

            // 2. Check whether the OTHER required CI ran for this SHA and, if so, whether it passed.
            const other = triggering === 'Backend CI' ? 'Frontend CI' : 'Backend CI';
            const otherJobName = JOB_NAMES[other];

            const { data } = await github.rest.checks.listForRef({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              ref:      sha,
              per_page: 100,
            });

            const otherRun = data.check_runs
              .filter(r => r.name === otherJobName)
              .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];

            if (otherRun && otherRun.status === 'completed' && otherRun.conclusion !== 'success') {
              // The other CI ran and failed — block.
              await postStatus(
                'failure',
                `${other} ${otherRun.conclusion} — deploy blocked`
              );
              core.setFailed(`${other} did not succeed (${otherRun.conclusion}).`);
              return;
            }

            if (otherRun && otherRun.status !== 'completed') {
              // The other CI is still running — stay pending, don't post yet.
              console.log(`${other} still in progress — skipping deploy-gate post.`);
              return;
            }

            // 3. Either both CIs passed, or the other didn't run (path filter skipped it — not needed).
            const bothRan = !!otherRun;
            const description = bothRan
              ? 'Backend + Frontend CI passed — safe to deploy'
              : `${triggering} passed — other CI not required for this change`;

            await postStatus('success', description);

  deploy-gate-check:
    needs: [gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all CI gates passed
        run: |
          if [[ "${{ needs.frontend-ci.result }}" == "failure" ]]; then
            echo "Frontend CI failed"; exit 1
          fi
          if [[ "${{ needs.backend-ci.result }}" == "failure" ]]; then
            echo "Backend CI failed"; exit 1
          fi
          echo "All CI gates passed"
